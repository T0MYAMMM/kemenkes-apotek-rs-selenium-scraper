[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kemenkes-apotek-rs-selenium-scraper"
version = "1.0.0"
description = "Selenium scrapers for Indonesian pharmacy and hospital data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "selenium>=4.10",
    "pandas>=1.5",
    "python-dotenv>=1.0",
]

[project.scripts]
apotek-rs-scraper = "scraper.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
